import java.util.Properties

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Read the local.properties file
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace "com.example.plantdiseasemobile"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.plantdiseasemobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        multiDexEnabled true

        // Make the API key available in BuildConfig
        buildConfigField "String", "OPENAI_API_KEY", localProperties.getProperty("OPENAI_API_KEY", "\"\"")

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion "1.5.4"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    packagingOptions {
        resources.excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
    }

}

dependencies {
    implementation platform("androidx.compose:compose-bom:2023.10.01")
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-compose:1.8.1"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation("androidx.compose.material3:material3") {
        exclude group: "com.google.android.material"
    }
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.exifinterface:exifinterface:1.3.7"

    // ExecuTorch Android CPU/XNNPACK: use local AAR placed in app/libs/
    implementation files("libs/executorch-android.aar")
    // Native loader needed by ExecuTorch runtime
    implementation "com.facebook.soloader:nativeloader:0.10.5"
    // fbjni native dependency required by libexecutorch.so
    implementation "com.facebook.fbjni:fbjni:0.5.1"

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
}

repositories {
    google()
    mavenCentral()
    // Use local AAR produced from ExecuTorch build_android_library.sh
    flatDir { dirs "libs" }
}
